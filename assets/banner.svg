<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1">
        <animate attributeName="stop-color" values="#4facfe;#00f2fe;#4facfe" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#00f2fe" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" />
  <text x="50%" y="40%" font-family="Arial, sans-serif" font-size="38" fill="white" font-weight="bold" dominant-baseline="middle" text-anchor="middle">Awesome Workforce Device Trust</text>
  <text x="50%" y="70%" font-family="Arial, sans-serif" font-size="20" fill="white" dominant-baseline="middle" text-anchor="middle">Curated tools for Zero-Trust and Posture Management</text>
</svg>
